name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  landing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --max-old-space-size=1024
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: no-comments check
        run: node scripts/nocomments-scan.mjs --check .
      - run: npm install --prefix ~/.dev-browser --no-package-lock playwright@1.58.2
      - run: ~/.dev-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: node --test tests/landing.test.mjs
